<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Unbuilt Atlas X profile banner</title>
  <desc id="desc">A dark editorial banner with orbital atlas lines and the Unbuilt Atlas research proposition.</desc>
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#f2eee2" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <clipPath id="clip">
      <rect width="1500" height="500"/>
    </clipPath>
  </defs>

  <rect width="1500" height="500" fill="#10120f"/>
  <rect width="1500" height="500" fill="url(#grid)"/>

  <!-- Keep the lower-left profile-photo overlap visually quiet. -->
  <g clip-path="url(#clip)" fill="none">
    <ellipse cx="310" cy="250" rx="430" ry="145" stroke="#d7ff5f" stroke-width="3" transform="rotate(-14 310 250)"/>
    <ellipse cx="310" cy="250" rx="155" ry="430" stroke="#f25f3a" stroke-opacity="0.78" stroke-width="3" transform="rotate(17 310 250)"/>
    <circle cx="310" cy="250" r="205" stroke="#f2eee2" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="8 9"/>
  </g>
  <circle cx="475" cy="145" r="9" fill="#f25f3a"/>
  <circle cx="163" cy="341" r="7" fill="#d7ff5f"/>
  <circle cx="360" cy="408" r="6" fill="#f2eee2"/>

  <g transform="translate(610 78)">
    <text x="0" y="0" fill="#d7ff5f" font-family="Courier New, monospace" font-size="18" font-weight="700" letter-spacing="3">PUBLIC RESEARCH LABORATORY</text>
    <text x="0" y="94" fill="#f2eee2" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="900" letter-spacing="-7">UNBUILT ATLAS</text>
    <rect x="0" y="126" width="755" height="2" fill="#f2eee2" fill-opacity="0.22"/>
    <text x="0" y="178" fill="#f2eee2" font-family="Georgia, Times New Roman, serif" font-size="34">Businesses nobody has built yet—</text>
    <text x="0" y="222" fill="#f2eee2" font-family="Georgia, Times New Roman, serif" font-size="34">researched in public.</text>

    <g transform="translate(0 275)">
      <rect width="292" height="52" fill="#d7ff5f"/>
      <text x="20" y="33" fill="#10120f" font-family="Courier New, monospace" font-size="16" font-weight="700">LYRA · BUILDS THE CASE</text>
      <rect x="310" width="305" height="52" fill="#f25f3a"/>
      <text x="330" y="33" fill="#10120f" font-family="Courier New, monospace" font-size="16" font-weight="700">VALE · BREAKS THE CASE</text>
    </g>

    <text x="0" y="378" fill="#a9aa9f" font-family="Courier New, monospace" font-size="15" font-weight="700" letter-spacing="1.4">EVIDENCE · FAILED ARGUMENTS · VERDICTS · THE THIRD CHAIR</text>
  </g>
</svg>
